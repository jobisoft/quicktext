<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n-content="quicktext.settings.title"></title>
  <link rel="stylesheet" href="manager.css">
  <script src="/vendor/floating-ui/floating-ui.core.umd.min.js"></script>
  <script src="/vendor/floating-ui/floating-ui.dom.umd.min.js"></script>
  <script type="module" src="manager.js"></script>
</head>
<body>
  <div id="app">

    <!-- Tab buttons -->
    <div id="tabs">
      <button class="tab-btn" id="tab-general" data-tab="general" data-i18n-content="quicktext.general.label" data-i18n-accesskey="quicktext.accesskey.general"></button>
      <button class="tab-btn active" id="tab-templates" data-tab="templates" data-i18n-content="quicktext.templates.label" data-i18n-accesskey="quicktext.accesskey.templates"></button>
      <button class="tab-btn" id="tab-scripts" data-tab="scripts" data-i18n-content="quicktext.scripts.label" data-i18n-accesskey="quicktext.accesskey.scripts"></button>
      <button class="tab-btn" id="tab-import" data-tab="import" data-i18n-content="quicktext.defaultImport.label" data-i18n-accesskey="quicktext.accesskey.defaultImport"></button>
      <button class="tab-btn" id="tab-advanced" data-tab="advanced" data-i18n-content="quicktext.advanced.label" data-i18n-accesskey="quicktext.accesskey.advanced"></button>
    </div>

    <!-- General Panel -->
    <div class="tab-panel" id="panel-general" hidden>
      <div class="two-col">
        <div class="col">
          <fieldset>
            <legend id="lbl-settings" data-i18n-content="quicktext.settings.label"></legend>
            <div class="field-rows">
              <label><input type="checkbox" id="chk-popup"> <span id="lbl-chk-popup" data-i18n-content="quicktext.showContextMenu.label"></span></label>
              <label><input type="checkbox" id="chk-collapse"> <span id="lbl-chk-collapse" data-i18n-content="quicktext.collapseSetting.label"></span></label>
              <div class="inline-row">
                <select id="sel-modifier">
                  <option value="alt" data-i18n-content="quicktext.altKey.label"></option>
                  <option value="control" data-i18n-content="quicktext.controlKey.label"></option>
                  <option value="meta" data-i18n-content="quicktext.metaKey.label"></option>
                </select>
                <span id="lbl-modifier" data-i18n-content="quicktext.modifierSetting.label"></span>
              </div>
              <label><input type="checkbox" id="chk-shortcut-adv"> <span id="lbl-chk-shortcut-adv" data-i18n-content="quicktext.shortcutTypeAdv.label"></span></label>
              <div class="inline-row">
                <select id="sel-keyword">
                  <option value="Tab" data-i18n-content="quicktext.tabKey.label"></option>
                  <option value="Space" data-i18n-content="quicktext.spaceKey.label"></option>
                  <option value="Enter" data-i18n-content="quicktext.enterKey.label"></option>
                  <option value="F2" data-i18n-content="quicktext.f2Key.label"></option>
                  <option value="F4" data-i18n-content="quicktext.f4Key.label"></option>
                  <option value="F5" data-i18n-content="quicktext.f5Key.label"></option>
                  <option value="F8" data-i18n-content="quicktext.f8Key.label"></option>
                  <option value="F11" data-i18n-content="quicktext.f11Key.label"></option>
                  <option value="F12" data-i18n-content="quicktext.f12Key.label"></option>
                </select>
                <span id="lbl-keyword-setting" data-i18n-content="quicktext.keywordKeySetting.label"></span>
              </div>
              <div>
                <label><input type="checkbox" id="chk-keyword-ci"> <span id="lbl-chk-case-insensitive" data-i18n-content="quicktext.caseInsensitive.label"></span></label>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="col">
          <fieldset>
            <legend id="lbl-counter"></legend>
            <div class="btn-row">
              <button id="btn-reset-counter" data-i18n-content="quicktext.resetcounter.label" data-i18n-accesskey="quicktext.accesskey.resetCounter"></button>
              <button id="btn-update-counter" data-i18n-content="quicktext.updatecounter.label" data-i18n-accesskey="quicktext.accesskey.updateCounter"></button>
            </div>
          </fieldset>
        </div>
      </div>
    </div>

    <!-- Templates Panel -->
    <div class="tab-panel" id="panel-templates">
      <div class="split-pane">
        <div class="sidebar">
          <fieldset class="flex-fieldset">
            <legend id="lbl-template-title" data-i18n-content="quicktext.templates.label"></legend>
            <div class="btn-row">
              <button id="btn-add-group" data-i18n-content="quicktext.addGroup.label" data-i18n-accesskey="quicktext.accesskey.addGroup"></button>
              <button id="btn-add-template" disabled data-i18n-content="quicktext.addTemplate.label" data-i18n-accesskey="quicktext.accesskey.addTemplate"></button>
            </div>
            <div id="template-tree" class="tree"></div>
            <div class="btn-row">
              <button id="btn-remove-template" disabled data-i18n-content="quicktext.remove.label" data-i18n-accesskey="quicktext.accesskey.remove"></button>
            </div>
          </fieldset>
        </div>
        <div class="detail">
          <fieldset class="flex-fieldset">
            <legend id="detail-caption"></legend>
            <table class="detail-table">
              <tr>
                <td class="detail-label" id="lbl-title" data-i18n-content="quicktext.title.label"></td>
                <td><input type="text" id="text-title" disabled style="width:100%"></td>
              </tr>
            </table>
            <div class="template-only var-row">
              <div style="flex:1"></div>
              <div id="tmpl-menu-wrap">
                <button id="btn-insert-tag" disabled data-i18n-content="quicktext.insertTag.label"></button>
                <div id="insert-tag-menu" hidden></div>
              </div>
            </div>
            <div class="template-only body-row">
              <textarea id="text-body" disabled spellcheck="false"></textarea>
            </div>
            <table class="detail-table template-only">
              <tr>
                <td class="detail-label" id="lbl-insert-as" data-i18n-content="quicktext.insertAs.label"></td>
                <td>
                  <select id="sel-type" disabled>
                    <option value="text/plain" id="opt-text" data-i18n-content="quicktext.text.label"></option>
                    <option value="text/html" id="opt-html" data-i18n-content="quicktext.HTML.label"></option>
                  </select>
                </td>
              </tr>
              <tr>
                <td class="detail-label" id="lbl-shortcut" data-i18n-content="quicktext.shortcut.label"></td>
                <td>
                  <span id="label-modifier"></span>
                  <select id="sel-shortcut" disabled>
                    <option value="" id="opt-none" data-i18n-content="quicktext.none.label"></option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="0">0</option>
                  </select>
                  <input type="text" id="text-shortcut-adv" disabled hidden style="width:50px">
                </td>
              </tr>
              <tr>
                <td class="detail-label" id="lbl-subject" data-i18n-content="quicktext.subject.label"></td>
                <td><input type="text" id="text-subject" disabled style="width:100%"></td>
              </tr>
              <tr>
                <td class="detail-label" id="lbl-tmpl-keyword" data-i18n-content="quicktext.keyword.label"></td>
                <td><input type="text" id="text-keyword" disabled style="width:100%"></td>
              </tr>
            </table>
          </fieldset>
        </div>
      </div>
    </div>

    <!-- Scripts Panel -->
    <div class="tab-panel" id="panel-scripts" hidden>
      <div class="split-pane">
        <div class="sidebar">
          <fieldset class="flex-fieldset">
            <legend id="lbl-script-title" data-i18n-content="quicktext.scripts.label"></legend>
            <div class="btn-row">
              <button id="btn-add-script" data-i18n-content="quicktext.addScript.label" data-i18n-accesskey="quicktext.accesskey.addScript"></button>
            </div>
            <ul id="script-list" class="source-list flex-list"></ul>
            <div class="btn-row">
              <button id="btn-remove-script" disabled data-i18n-content="quicktext.remove.label" data-i18n-accesskey="quicktext.accesskey.remove"></button>
            </div>
          </fieldset>
        </div>
        <div class="detail">
          <fieldset class="flex-fieldset">
            <legend id="script-caption" data-i18n-content="quicktext.script.label"></legend>
            <table class="detail-table">
              <tr>
                <td class="detail-label" id="lbl-script-name" data-i18n-content="quicktext.title.label"></td>
                <td><input type="text" id="script-title" disabled style="width:100%"></td>
              </tr>
            </table>
            <div class="body-row" style="position:relative">
              <textarea id="script-body" disabled spellcheck="false" wrap="off"></textarea>
            </div>
          </fieldset>
        </div>
      </div>
    </div>

    <!-- Advanced Panel -->
    <div class="tab-panel" id="panel-advanced" hidden>
      <fieldset>
        <legend id="lbl-storage" data-i18n-content="quicktext.storageLocations.label"></legend>
        <p id="lbl-storage-desc" style="margin:4px 0 8px;font-size:0.9em" data-i18n-content="quicktext.storageLocations.description"></p>
        <ul id="storage-list" class="source-list grid-list"></ul>
        <div class="btn-row" style="margin-top:4px">
          <button id="btn-add-storage-config" data-i18n-content="quicktext.buttons.addConfig.label"></button>
          <button id="btn-rename-storage" disabled data-i18n-content="quicktext.buttons.renameStorage.label"></button>
          <button id="btn-remove-storage" disabled data-i18n-content="quicktext.remove.label" data-i18n-accesskey="quicktext.accesskey.remove"></button>
          <div style="flex:1"></div>
          <button id="btn-browse-storage" disabled data-i18n-content="quicktext.buttons.browseStorage.label"></button>
          <button id="btn-export-storage" disabled data-i18n-content="quicktext.export.label" data-i18n-accesskey="quicktext.accesskey.exportTemplates"></button>
          <button id="btn-import-storage" disabled data-i18n-content="quicktext.import.label" data-i18n-accesskey="quicktext.accesskey.importTemplates"></button>
        </div>
      </fieldset>
      <p style="margin:12px 4px 4px;font-size:0.9em;color:#666" data-i18n-content="quicktext.advanced.description"></p>
      <div class="btn-row" style="margin:0 4px">
        <button id="btn-search-vfs-providers" data-i18n-content="quicktext.buttons.searchVfsProviders.label"></button>
      </div>
    </div>

    <!-- Default Import Panel -->
    <div class="tab-panel" id="panel-import" hidden>
      <fieldset>
        <legend id="lbl-import" data-i18n-content="quicktext.defaultImport.legend"></legend>
        <p id="lbl-import-desc" style="margin:4px 0 8px;font-size:0.9em" data-i18n-content="quicktext.defaultImport.description"></p>
        <ul id="import-list" class="source-list grid-list"></ul>
        <div class="btn-row" style="margin-top:4px">
          <button id="btn-add-import" data-i18n-content="quicktext.buttons.addConfig.label"></button>
          <button id="btn-rename-import" disabled data-i18n-content="quicktext.buttons.renameStorage.label"></button>
          <button id="btn-remove-import" disabled data-i18n-content="quicktext.remove.label" data-i18n-accesskey="quicktext.accesskey.remove"></button>
        </div>
      </fieldset>
    </div>

    <!-- Bottom bar -->
    <div id="bottom-bar">
      <button id="btn-community-scripts" hidden data-i18n-content="quicktext.getScript.label" data-i18n-accesskey="quicktext.accesskey.communityScripts"></button>
      <div style="flex:1"></div>
      <button id="btn-script-help" hidden data-i18n-content="quicktext.scripthelp.label"></button>
      <button id="btn-help" data-i18n-content="quicktext.help.label" data-i18n-accesskey="quicktext.accesskey.help"></button>
      <button id="btn-save" disabled data-i18n-content="quicktext.save.label" data-i18n-accesskey="quicktext.accesskey.save"></button>
      <button id="btn-close" data-i18n-content="quicktext.close.label" data-i18n-accesskey="quicktext.accesskey.close"></button>
    </div>

  </div>

  <div id="dialog-overlay" hidden>
    <div id="dialog-box">
      <div id="dialog-title"></div>
      <div id="dialog-message"></div>
      <div id="dialog-fields"></div>
      <div id="dialog-error"></div>
      <div id="dialog-buttons"></div>
    </div>
  </div>
</body>
</html>
